<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuizRush — Trivia Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="app">

    <header class="app-header">
        <div class="logo">
            <span class="logo-icon">🧠</span>
            <span class="logo-text">Quiz<b>Rush</b></span>
        </div>
        <div class="score-pill">
            <span class="score-label">SKOR</span>
            <span class="score-value" id="scoreValue">0</span>
        </div>
    </header>

    <!-- VIEW: PILIH MODE -->
    <main class="view" id="viewSelect">
        <div class="hero-copy">
            <h1>Seberapa Cerdas<br>Otakmu?</h1>
            <p>Pilih mode kuis — jawab secepat mungkin sebelum waktu habis.</p>
        </div>

        <div class="level-grid" id="levelGrid"></div>


        <div class="streak-card" id="streakCard" style="display:none;">
            <span class="streak-icon">🔥</span>
            <div class="streak-text">
                <span class="streak-label">Best Streak</span>
                <span class="streak-value" id="streakValue">0</span>
            </div>
        </div>
    </main>

    <!-- VIEW: BERMAIN -->
    <main class="view" id="viewPlay" style="display:none;">
        <div class="play-top">
            <button class="btn-quit" id="btnQuit">✕ Keluar</button>
            <span class="level-badge" id="levelBadge">—</span>
        </div>

        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-label" id="timerLabel">--</div>

        <div class="question-card" id="questionCard">
            <span class="question-label">PERTANYAAN</span>
            <div class="question-expr" id="questionExpr">—</div>
        </div>

        <form class="answer-form" id="answerForm">
            <input type="text" id="answerInput" class="answer-input" placeholder="Jawabanmu..." autocomplete="off">
            <button type="submit" class="btn-submit">Cek</button>
        </form>

        <div class="feedback-banner" id="feedbackBanner" style="display:none;"></div>

        <div class="loading-state" id="loadingState" style="display:none;">
            <div class="spinner"></div>
            <span>Menyiapkan soal...</span>
        </div>
    </main>

    <footer class="app-footer">Soal disuplai oleh api-faa.my.id</footer>
</div>

<script src="script.js"></script>
</body>
</html>
